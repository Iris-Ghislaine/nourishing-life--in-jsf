<ui:composition template="/template.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:define name="content">

    <div class="nl-auth-page">
        <div class="nl-auth-card">
            <h1 style="color:#4F6B1C; text-align:center; margin-bottom:0.25rem;">Welcome Back</h1>
            <p class="nl-muted" style="text-align:center; margin-bottom:1.5rem;">Sign in to Nourishing Life</p>

            <h:form id="signInForm">
                <h:messages globalOnly="true" styleClass="nl-messages" layout="table"/>

                <div class="nl-field">
                    <h:outputLabel for="email" value="Email"/>
                    <h:inputText id="email" value="#{authBean.signInEmail}" required="true"
                                 requiredMessage="Email is required" styleClass="nl-input">
                        <f:validateLength minimum="3" maximum="150"/>
                    </h:inputText>
                    <h:message for="email" styleClass="nl-error"/>
                </div>

                <div class="nl-field">
                    <h:outputLabel for="password" value="Password"/>
                    <h:inputSecret id="password" value="#{authBean.signInPassword}" required="true"
                                    requiredMessage="Password is required" styleClass="nl-input"/>
                    <h:message for="password" styleClass="nl-error"/>
                </div>

                <h:commandButton value="Sign In" action="#{authBean.signIn}" styleClass="nl-btn nl-btn-primary" style="width:100%;"/>
            </h:form>

            <p style="text-align:center; margin-top:1.25rem;">
                Don't have an account? <h:link value="Sign up" outcome="/signup.xhtml"/>
            </p>
        </div>
    </div>

</ui:define>
</ui:composition>
