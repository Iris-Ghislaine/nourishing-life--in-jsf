<ui:composition template="/template.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:define name="content">
    <f:metadata>
        <f:viewAction action="#{diseaseBean.init}"/>
    </f:metadata>

    <section class="nl-hero">
        <h1>Eat Right for Your Health</h1>
        <p>Personalized meal guidance for chronic disease management.</p>
    </section>

    <section class="nl-section">
        <h2 style="color:#4F6B1C;">Choose a Health Condition</h2>
        <div class="nl-card-grid">
            <ui:repeat value="#{diseaseBean.diseases}" var="disease">
                <h:link outcome="/disease.xhtml" styleClass="nl-disease-card"
                        style="background: linear-gradient(135deg, #{disease.colorFrom} 0%, #{disease.colorTo} 100%);">
                    <f:param name="diseaseId" value="#{disease.id}"/>
                    <span class="nl-disease-icon">#{disease.icon}</span>
                    <span class="nl-disease-name">#{disease.name}</span>
                    <span class="nl-disease-desc">#{disease.description}</span>
                </h:link>
            </ui:repeat>
        </div>
    </section>

</ui:define>
</ui:composition>
