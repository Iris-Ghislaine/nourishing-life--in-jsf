<ui:composition template="/template.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:define name="content">
    <f:metadata>
        <f:viewAction action="#{userBean.init}"/>
    </f:metadata>

    <h1 style="color:#4F6B1C;">Manage Users</h1>
    <p><h:link value="&#8592; Back to Dashboard" outcome="/admin/dashboard.xhtml"/></p>

    <div class="nl-panel">
        <h2>Add New User (Create)</h2>
        <h:form id="createForm">
            <h:messages globalOnly="true" styleClass="nl-messages" layout="table"/>
            <div class="nl-form-row">
                <div class="nl-field">
                    <h:outputLabel for="cName" value="Name"/>
                    <h:inputText id="cName" value="#{userBean.newName}" required="true" styleClass="nl-input">
                        <f:validateLength minimum="2" maximum="100"/>
                    </h:inputText>
                    <h:message for="cName" styleClass="nl-error"/>
                </div>
                <div class="nl-field">
                    <h:outputLabel for="cEmail" value="Email"/>
                    <h:inputText id="cEmail" value="#{userBean.newEmail}" required="true" styleClass="nl-input"/>
                    <h:message for="cEmail" styleClass="nl-error"/>
                </div>
                <div class="nl-field">
                    <h:outputLabel for="cPhone" value="Phone"/>
                    <h:inputText id="cPhone" value="#{userBean.newPhone}" styleClass="nl-input">
                        <f:validator validatorId="phoneNumberValidator"/>
                    </h:inputText>
                    <h:message for="cPhone" styleClass="nl-error"/>
                </div>
                <div class="nl-field">
                    <h:outputLabel for="cPassword" value="Initial Password"/>
                    <h:inputSecret id="cPassword" value="#{userBean.newPassword}" styleClass="nl-input"/>
                </div>
                <div class="nl-field">
                    <h:outputLabel for="cRole" value="Role"/>
                    <h:selectOneMenu id="cRole" value="#{userBean.newRole}" styleClass="nl-input">
                        <f:selectItems value="#{userBean.roles}"/>
                    </h:selectOneMenu>
                </div>
            </div>
            <h:commandButton value="Add User" action="#{userBean.createUser}" styleClass="nl-btn nl-btn-primary"/>
        </h:form>
    </div>

    <div class="nl-panel">
        <h2>All Users (Read / Update / Delete)</h2>
        <table class="nl-table">
            <thead>
            <tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Created</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <ui:repeat value="#{userBean.users}" var="u">
                <tr>
                    <ui:fragment rendered="#{userBean.editingUser != null and userBean.editingUser.id eq u.id}">
                        <td colspan="6">
                            <h:form>
                                <div class="nl-form-row">
                                    <h:inputText value="#{userBean.editingUser.name}" styleClass="nl-input">
                                        <f:validateLength minimum="2" maximum="100"/>
                                    </h:inputText>
                                    <h:inputText value="#{userBean.editingUser.phone}" styleClass="nl-input">
                                        <f:validator validatorId="phoneNumberValidator"/>
                                    </h:inputText>
                                    <h:selectOneMenu value="#{userBean.editingUser.role}" styleClass="nl-input">
                                        <f:selectItems value="#{userBean.roles}"/>
                                    </h:selectOneMenu>
                                    <h:commandButton value="Save" action="#{userBean.saveEdit}" styleClass="nl-btn nl-btn-primary"/>
                                    <h:commandButton value="Cancel" action="#{userBean.cancelEdit}" styleClass="nl-btn" immediate="true"/>
                                </div>
                            </h:form>
                        </td>
                    </ui:fragment>
                    <ui:fragment rendered="#{userBean.editingUser == null or userBean.editingUser.id ne u.id}">
                        <td>#{u.name}</td>
                        <td>#{u.email}</td>
                        <td>#{u.phone}</td>
                        <td>
                            <span style="padding:0.15rem 0.6rem; border-radius:8px; font-size:0.8rem; background-color:#{u.role eq 'ADMIN' ? '#DBEAFE' : '#F3F4F6'}; color:#{u.role eq 'ADMIN' ? '#1E40AF' : '#374151'};">
                                #{u.role}
                            </span>
                        </td>
                        <td><h:outputText value="#{u.createdAt}"/></td>
                        <td>
                            <h:form>
                                <h:commandButton value="Edit" action="#{userBean.startEdit(u)}" styleClass="nl-btn" immediate="true"/>
                                <h:commandButton value="Delete" action="#{userBean.delete(u.id)}" styleClass="nl-btn nl-btn-danger"
                                                  onclick="return confirm('Delete this user?');"/>
                            </h:form>
                        </td>
                    </ui:fragment>
                </tr>
            </ui:repeat>
            </tbody>
        </table>
    </div>

</ui:define>
</ui:composition>
