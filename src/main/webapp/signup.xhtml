<ui:composition template="/template.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:define name="content">

    <div class="nl-auth-page">
        <div class="nl-auth-card">
            <h1 style="color:#4F6B1C; text-align:center; margin-bottom:0.25rem;">Create Account</h1>
            <p class="nl-muted" style="text-align:center; margin-bottom:1.5rem;">Join Nourishing Life today</p>

            <h:form id="signUpForm">
                <h:messages globalOnly="true" styleClass="nl-messages" layout="table"/>

                <div class="nl-field">
                    <h:outputLabel for="name" value="Full Name"/>
                    <!-- JSF standard validator: f:validateLength (type 1 of 3) -->
                    <h:inputText id="name" value="#{authBean.signUpName}" required="true" styleClass="nl-input">
                        <f:validateLength minimum="2" maximum="100"/>
                    </h:inputText>
                    <h:message for="name" styleClass="nl-error"/>
                </div>

                <div class="nl-field">
                    <h:outputLabel for="email" value="Email"/>
                    <!-- Bean Validation @Email/@NotBlank on AuthBean.signUpEmail (type 2 of 3) -->
                    <h:inputText id="email" value="#{authBean.signUpEmail}" required="true" styleClass="nl-input"/>
                    <h:message for="email" styleClass="nl-error"/>
                </div>

                <div class="nl-field">
                    <h:outputLabel for="phone" value="Phone (optional)"/>
                    <!-- Custom JSF Validator (type 3 of 3) -->
                    <h:inputText id="phone" value="#{authBean.signUpPhone}" styleClass="nl-input">
                        <f:validator validatorId="phoneNumberValidator"/>
                    </h:inputText>
                    <h:message for="phone" styleClass="nl-error"/>
                </div>

                <div class="nl-field">
                    <h:outputLabel for="password" value="Password"/>
                    <h:inputSecret id="password" value="#{authBean.signUpPassword}" required="true" styleClass="nl-input"/>
                    <h:message for="password" styleClass="nl-error"/>
                </div>

                <div class="nl-field">
                    <h:outputLabel for="confirmPassword" value="Confirm Password"/>
                    <!-- Custom cross-field JSF Validator (type 3 of 3) -->
                    <h:inputSecret id="confirmPassword" value="#{authBean.signUpConfirmPassword}" required="true" styleClass="nl-input">
                        <f:validator validatorId="passwordMatchValidator"/>
                        <f:attribute name="passwordComponentId" value="password"/>
                    </h:inputSecret>
                    <h:message for="confirmPassword" styleClass="nl-error"/>
                </div>

                <h:commandButton value="Sign Up" action="#{authBean.signUp}" styleClass="nl-btn nl-btn-primary" style="width:100%; background-color:#E37522;"/>
            </h:form>

            <p style="text-align:center; margin-top:1.25rem;">
                Already have an account? <h:link value="Sign in" outcome="/signin.xhtml"/>
            </p>
        </div>
    </div>

</ui:define>
</ui:composition>
